# The files in this repo are loaded by Claude Code and acted on, so a change here
# is a behavior change. This is the check that stands between a malformed skill
# and the sessions that would load it.
#
# There are no dependencies and no lockfile on purpose: the tests use node --test
# and touch no network. The one install is Claude Code at an exact version, for the
# plugin's wiring tests.
name: ci

on:
  # Both names while master moves to main (capsid job_bf05bc756c5e, plan step 1), so a
  # push is checked on either side of the rename. Step 4 drops master.
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Validate the skill package format
        run: npm run validate

      - name: Test
        run: npm test

      - name: Test the ops-guards wiring
        working-directory: plugins/ops-guards
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.309
          claude plugin test
